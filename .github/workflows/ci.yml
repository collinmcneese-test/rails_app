name: CI

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        ruby-version: [ '3.2.4' ]
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: bundle install
      - run: bundle exec rubocop
      - run: bundle exec rake test
  deploy-staging:
    if: github.ref_name == 'main'
    needs:
      - test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: staging deploy
        run: |
          echo "deployment steps will run here"
          exit 0
  deploy-prod:
    if: github.ref_name == 'main'
    needs:
      - test
      - deploy-staging
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: staging deploy
        run: |
          echo "deployment steps will run here"
          exit 0
