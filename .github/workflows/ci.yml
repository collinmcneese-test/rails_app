name: CI

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        ruby-version: [ '3.2.4' ]
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: development
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: bundle install
      - run: bundle exec rubocop
      - run: bundle exec rake test
  deploy-staging:
    if: github.ref_name == 'main'
    needs:
      - test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: staging deploy
        run: |
          echo "deployment steps will run here"
          exit 0
  deploy-prod:
    if: github.ref_name == 'main'
    needs:
      - test
      - deploy-staging
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: staging deploy
        run: |
          echo "deployment steps will run here"
          exit 0
