name: CI

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        ruby-version: [ '3.2.4' ]
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: bundle install
      - run: bundle exec rubocop
      - run: bundle exec rake test
  deploy-staging:
    if: github.ref_name == 'main'
    needs:
      - test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: staging deploy
        run: |
          echo "deployment steps will run here"
          exit 0
  deploy-prod:
    if: github.ref_name == 'main'
    needs:
      - test
      - deploy-staging
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: staging deploy
        run: |
          echo "deployment steps will run here"
          exit 0
